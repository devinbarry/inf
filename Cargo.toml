# The project, repo and binary are all `inf`. Only the package name differs:
# `inf` is already taken on crates.io by an unrelated crate, so the package is
# named `ifp` while the binary installed on PATH stays `inf`.
#
# `publish = false` because it is not on crates.io today; `cargo install --path .`
# is unaffected. Drop that line if the `ifp` name is ever claimed and published.
[package]
name = "ifp"
version = "0.2.3"
edition = "2021"
description = "Infisical control-plane CLI - manage projects, environments and machine identities"
license = "MIT"
repository = "https://example.invalid/tools/inf"
publish = false

[[bin]]
name = "inf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
colored = "2"
dirs = "5"
base64 = "0.22"
unicode-width = "0.2.2"
libc = "0.2.189"

[dev-dependencies]
mockito = "1"
tempfile = "3"    # tests/cli.rs writes a fake `infisical` shim onto the child's PATH

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
