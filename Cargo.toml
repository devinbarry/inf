# The project, repo and binary are all `inf`. Only the package name differs:
# `inf` is already taken on crates.io by an unrelated crate, so the crate is
# published as `ifp` while the binary installed on PATH stays `inf`.
#
# `publish = false` keeps a local `cargo publish` from ever running; the GitHub
# release workflow enables publishing for release tags only.
[package]
name = "ifp"
version = "0.3.0"
edition = "2021"
description = "Infisical control-plane CLI - manage projects, environments and machine identities"
license = "MIT"
# Only what the crate needs; everything else stays out of crates.io.
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]
repository = "https://github.com/devinbarry/inf"
homepage = "https://github.com/devinbarry/inf"
readme = "README.md"
keywords = ["infisical", "secrets", "cli", "devops"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "inf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
colored = "2"
dirs = "5"
base64 = "0.22"
unicode-width = "0.2.2"
libc = "0.2.189"

[dev-dependencies]
mockito = "1"
tempfile = "3"    # tests/cli.rs writes a fake `infisical` shim onto the child's PATH

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
