# The project, repo and binary are all `inf`. Only the crates.io package name
# differs: `inf` is already taken there by an unrelated crate, so the package
# publishes as `ifp` while the binary installed on PATH stays `inf`.
[package]
name = "ifp"
version = "0.1.0"
edition = "2021"
description = "Infisical control-plane CLI - manage projects, environments and machine identities"
license = "MIT"
repository = "https://github.com/devinbarry/inf"
publish = false

[[bin]]
name = "inf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
colored = "2"
dirs = "5"
base64 = "0.22"

[dev-dependencies]
serial_test = "3"
mockito = "1"
tempfile = "3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
